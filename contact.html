<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="bodycontact">
    <header>
        <div>
            <!-- Image header -->
        <img class="image-head" src="download.jpg">
        </div>
        <div>
            <nav id="nav-links">
                <a class="link-buttons" href="home.html">Home</a>
                <a class="link-buttons" href="about.html">About</a>
                <a class="link-buttons" href="projects.html">Projects</a>
                <a class="link-buttons" href="contact.html">Contact</a>
            </nav>
        </div>
     </header>
     <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title" >
                <h2>Get in touch With me</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="d4d0f63e-3a9c-44ed-b54b-ceba7c610ac4">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="contact-inputs" placeholder="Name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="contact-inputs" placeholder="email@address" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" class="contact-inputs" placeholder="Message" required></textarea>
            <button type="submit">Submit <img src="arrow button.png" alt="Arrow"></button>
        </form>
        <div class="contact-right">
            <img class="mail" src="mail image.webp" alt="mailboximage">
        </div>
     </div>
</body>
</html>
